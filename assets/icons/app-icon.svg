<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Desktop 3D Pet Application Icon -->
  <!-- High-resolution app icon for Windows/macOS/Linux -->
  
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner highlight -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Pet face base -->
  <ellipse cx="128" cy="138" rx="70" ry="65" fill="url(#faceGradient)"/>
  
  <!-- Left ear -->
  <ellipse cx="75" cy="70" rx="28" ry="35" fill="url(#faceGradient)" transform="rotate(-15, 75, 70)"/>
  <ellipse cx="75" cy="70" rx="15" ry="20" fill="#ffb6c1" transform="rotate(-15, 75, 70)"/>
  
  <!-- Right ear -->
  <ellipse cx="181" cy="70" rx="28" ry="35" fill="url(#faceGradient)" transform="rotate(15, 181, 70)"/>
  <ellipse cx="181" cy="70" rx="15" ry="20" fill="#ffb6c1" transform="rotate(15, 181, 70)"/>
  
  <!-- Left eye -->
  <ellipse cx="100" cy="125" rx="18" ry="22" fill="#ffffff"/>
  <ellipse cx="102" cy="128" rx="10" ry="14" fill="#4a4a4a"/>
  <circle cx="106" cy="122" r="5" fill="#ffffff"/>
  
  <!-- Right eye -->
  <ellipse cx="156" cy="125" rx="18" ry="22" fill="#ffffff"/>
  <ellipse cx="154" cy="128" rx="10" ry="14" fill="#4a4a4a"/>
  <circle cx="158" cy="122" r="5" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="128" cy="155" rx="12" ry="9" fill="#4a4a4a"/>
  <ellipse cx="128" cy="153" rx="5" ry="3" fill="#6a6a6a"/>
  
  <!-- Mouth - happy smile -->
  <path d="M 108 170 Q 128 190 148 170" stroke="#4a4a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Blush marks -->
  <ellipse cx="78" cy="150" rx="12" ry="8" fill="#ffb6c1" opacity="0.6"/>
  <ellipse cx="178" cy="150" rx="12" ry="8" fill="#ffb6c1" opacity="0.6"/>
  
  <!-- Whiskers -->
  <line x1="55" y1="145" x2="85" y2="150" stroke="#c0c0c0" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="160" x2="85" y2="158" stroke="#c0c0c0" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="175" x2="85" y2="166" stroke="#c0c0c0" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="201" y1="145" x2="171" y2="150" stroke="#c0c0c0" stroke-width="2" stroke-linecap="round"/>
  <line x1="201" y1="160" x2="171" y2="158" stroke="#c0c0c0" stroke-width="2" stroke-linecap="round"/>
  <line x1="201" y1="175" x2="171" y2="166" stroke="#c0c0c0" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Sparkle decorations -->
  <g fill="#ffffff" opacity="0.8">
    <polygon points="45,45 48,52 55,52 50,57 52,65 45,60 38,65 40,57 35,52 42,52" />
    <polygon points="211,45 214,52 221,52 216,57 218,65 211,60 204,65 206,57 201,52 208,52" transform="scale(0.7) translate(90, 20)"/>
  </g>
</svg>