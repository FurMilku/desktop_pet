<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Desktop 3D Pet Tray Icon -->
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#4A90D9" stroke="#2E6BB0" stroke-width="1"/>
  
  <!-- Pet face base -->
  <ellipse cx="16" cy="17" rx="10" ry="9" fill="#F5DEB3"/>
  
  <!-- Left ear -->
  <ellipse cx="9" cy="9" rx="4" ry="5" fill="#E8D4A8" transform="rotate(-20, 9, 9)"/>
  <ellipse cx="9" cy="9" rx="2.5" ry="3" fill="#FFB6C1" transform="rotate(-20, 9, 9)"/>
  
  <!-- Right ear -->
  <ellipse cx="23" cy="9" rx="4" ry="5" fill="#E8D4A8" transform="rotate(20, 23, 9)"/>
  <ellipse cx="23" cy="9" rx="2.5" ry="3" fill="#FFB6C1" transform="rotate(20, 23, 9)"/>
  
  <!-- Left eye -->
  <ellipse cx="12" cy="15" rx="2.5" ry="3" fill="#333"/>
  <circle cx="11.5" cy="14" r="0.8" fill="#FFF"/>
  
  <!-- Right eye -->
  <ellipse cx="20" cy="15" rx="2.5" ry="3" fill="#333"/>
  <circle cx="19.5" cy="14" r="0.8" fill="#FFF"/>
  
  <!-- Nose -->
  <ellipse cx="16" cy="19" rx="2" ry="1.5" fill="#333"/>
  <ellipse cx="16" cy="18.5" rx="0.8" ry="0.5" fill="#666"/>
  
  <!-- Mouth - smile -->
  <path d="M13 21 Q16 24 19 21" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers left -->
  <line x1="6" y1="17" x2="10" y2="18" stroke="#888" stroke-width="0.5"/>
  <line x1="6" y1="19" x2="10" y2="19" stroke="#888" stroke-width="0.5"/>
  <line x1="6" y1="21" x2="10" y2="20" stroke="#888" stroke-width="0.5"/>
  
  <!-- Whiskers right -->
  <line x1="26" y1="17" x2="22" y2="18" stroke="#888" stroke-width="0.5"/>
  <line x1="26" y1="19" x2="22" y2="19" stroke="#888" stroke-width="0.5"/>
  <line x1="26" y1="21" x2="22" y2="20" stroke="#888" stroke-width="0.5"/>
</svg>