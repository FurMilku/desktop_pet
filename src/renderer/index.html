<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- blob:/data: 为 GLB 内嵌贴图所必需（Three.js 通过 blob URL 加载纹理） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*">
  <title>桌面3D小宠物</title>
  <style>
    /* 透明窗口样式 - 关键配置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      /* 允许点击穿透到桌面，除了宠物区域 */
      -webkit-app-region: no-drag;
    }
    
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    /* Three.js 渲染容器 */
    #pet-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      /* 完全透明背景，配合 setIgnoreMouseEvents(true, { forward: true }) */
      /* 渲染器会动态检测鼠标是否在宠物上，切换穿透状态 */
      background: transparent;
      /* 确保鼠标事件不会被阻止 */
      pointer-events: auto;
    }
    
    /* 加载状态 */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      display: none;
    }
    
    #loading.visible {
      display: block;
    }
    
    /* 错误状态 */
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #e74c3c;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      display: none;
    }
    
    #error.visible {
      display: block;
    }

    /* 菜单开启「显示窗口边缘」时的可视边框（配合系统边缘拖拽缩放） */
    body.pet-window-frame-visible {
      box-shadow: inset 0 0 0 2px rgba(96, 165, 250, 0.85);
    }

    body.pet-window-frame-visible #app::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      box-sizing: border-box;
    }

    #fps-monitor {
      position: absolute;
      z-index: 100;
      padding: 4px 8px;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
      color: #e8ffe8;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      pointer-events: none;
      white-space: pre;
      font-variant-numeric: tabular-nums;
      display: none;
    }

    #fps-monitor.is-visible {
      display: block;
    }

    #fps-monitor.pos-top-left { top: 8px; left: 8px; }
    #fps-monitor.pos-top-right { top: 8px; right: 8px; }
    #fps-monitor.pos-bottom-left { bottom: 8px; left: 8px; }
    #fps-monitor.pos-bottom-right { bottom: 8px; right: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Three.js 渲染目标 -->
    <div id="pet-container"></div>
    
    <div id="fps-monitor" aria-hidden="true"></div>
    
    <!-- 加载状态指示 -->
    <div id="loading" class="visible">正在加载宠物...</div>
    
    <!-- 错误显示区域 -->
    <div id="error">
      <p>加载失败</p>
      <p id="error-message"></p>
    </div>
  </div>
  
  <!-- 渲染进程入口脚本 -->
  <script type="module" src="./main.ts"></script>
</body>
</html>
